name: Deploy CloudGuard frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare frontend artifact
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          cp -R frontend _site
          printf 'window.GOOGLE_MAPS_API_KEY = "%s";\n' "$GOOGLE_MAPS_API_KEY" > _site/config/config.js

      - name: Verify production frontend configuration
        run: |
          test -f _site/config/config.js
          grep -Fq 'window.GOOGLE_MAPS_API_KEY' _site/config/config.js
          grep -Eq '^window\.GOOGLE_MAPS_API_KEY = ".+";$' _site/config/config.js
          echo "Production frontend configuration verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4